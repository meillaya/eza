<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duplicate review — Bookmarks</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar dedup-topbar">
    <a class="btn" href="/">← All bookmarks</a>
    <div class="dedup-heading">
      <span class="dedup-title">Duplicate review</span>
      <span class="dedup-subtitle">Review candidate groups, keep one row, merge the rest — every merge is undo-able.</span>
    </div>
    <button id="dedup-undo" class="btn" type="button">Undo last merge</button>
  </header>

  <main id="dedup" class="dedup-main">
    <p id="dedup-status" class="dedup-status" role="status" aria-live="polite"></p>
    <div id="dedup-groups" class="dedup-groups"></div>
  </main>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
