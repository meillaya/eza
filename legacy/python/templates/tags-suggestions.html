<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI tagging — Bookmarks</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar dedup-topbar">
    <a class="btn" href="/">← All bookmarks</a>
    <div class="dedup-heading">
      <span class="dedup-title">AI tagging</span>
      <span class="dedup-subtitle">Per-bookmark tag suggestions drawn from your existing tags — nothing is applied until you approve.</span>
    </div>
  </header>

  <main id="tags-suggestions" class="dedup-main">
    <p id="ts-status" class="dedup-status" role="status" aria-live="polite"></p>
    <div class="ts-controls">
      <label class="ts-tag-label">Tag bucket
        <select id="ts-tag" aria-label="Pick a tag bucket"></select>
      </label>
      <button id="ts-load" class="btn" type="button">Load suggestions</button>
      <span id="ts-summary" class="ts-summary" hidden></span>
    </div>
    <ul id="ts-list" class="ts-list"></ul>
  </main>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
