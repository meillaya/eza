name: e2e

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the adapted e2e harness image
        run: docker build -f Dockerfile.e2e -t bookmarks-e2e .
      - name: Run Playwright e2e suite
        # The adapted image carries Python 3.12 + uv (uv sync --frozen runs
        # before the suite); browsers are prebaked at /ms-playwright.
        run: |
          docker run --rm \
            --user root \
            --ipc=host \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e UV_PROJECT_ENVIRONMENT=/tmp/bookmarks-e2e-venv \
            -v "$PWD":/work \
            -w /work \
            bookmarks-e2e \
            bash -lc "bun install --frozen-lockfile && uv sync --frozen && bun run test:e2e"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
