[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookmarks"
version = "0.1.0"
description = "A fast, tag-based bookmark manager for 10k+ links"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "selectolax>=0.3",
    "python-multipart>=0.0.9",
    "webauthn==3.0.0",
    "trafilatura>=2.2.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
bookmarks-server = "app.main:main"
bookmarks-check-dead = "app.check_dead:main"
bookmarks-retag = "app.auto_tag:main"
bookmarks-heuristic-tag = "app.heuristic_tag:main"
bookmarks-reset-auth = "app.reset_auth:main"
bookmarks-export-notes = "app.export_notes:main"
bookmarks-export = "app.exporter:main"
bookmarks-snapshot = "app.snapshot:main"
bookmarks-backfill-extract = "app.backfill_extract:main"
bookmarks-backup = "app.backup:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.61",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

# Ship the HTML templates and static assets in the wheel so an installed app
# renders pages from site-packages. app/main.py resolves them __file__-relative
# (ROOT = parent of the package dir), which is site-packages for a wheel
# install, so the force-include destinations must be the wheel-root
# directories. Declared at the top level so the SDIST also carries them — uv
# build builds the wheel from the unpacked sdist, which would otherwise miss
# the files. Running from a checkout is no longer the only supported mode.
[tool.hatch.build]
force-include = { "templates" = "templates/", "static" = "static/" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific
    "TID",   # flake8-tidy-imports
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function calls in default argument (FastAPI uses Depends())
]

[tool.ruff.lint.per-file-ignores]
"static/**" = ["ALL"]
# Tests intentionally use en-dashes and other "ambiguous" Unicode that
# appears in real browser-exported bookmark files.
"tests/**" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# ty (Astral type checker)
# ---------------------------------------------------------------------------

[tool.ty.environment]
python = ".venv"
python-version = "3.11"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
