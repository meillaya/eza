name: Create GitHub release

# Creates the GitHub release on a v* tag. The web client and server are built
# from source by the deployment flake (packages.<system>.eza-web and
# .eza-bookmarks); there is no prebuilt web-asset upload and no SRI pin any
# more. The container image is published separately by release-image.yml once
# this workflow has created the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version from flake.nix (e.g. 0.2.0.0); must match scripts/version.sh"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/version.sh)"
          tag="v${version}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested="${{ inputs.version }}"
            if [ -n "$requested" ] && [ "$requested" != "$version" ]; then
              echo "::error title=Version mismatch::workflow input '$requested' does not match flake.nix/scripts/version.sh '$version'."
              exit 1
            fi
            if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error title=Missing release tag::tag ${tag} does not exist; refusing to create a release from an untagged tree."
              exit 1
            fi
          elif [ "${{ github.ref_type }}" != "tag" ] || [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error title=Tag/version mismatch::tag '${{ github.ref_name }}' does not match scripts/version.sh '$version' (expected '$tag'). Bump flake.nix + the Cabal versions before tagging."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::release ${tag}"

      - name: Create or update the GitHub release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$(cat <<EOF
          ## Quick start

          \`\`\`bash
          docker run -d --name eza --restart unless-stopped \\
            -p 8080:8080 -v eza-data:/data \\
            ghcr.io/meillaya/eza:${VERSION}
          \`\`\`

          Open <http://localhost:8080/setup> and create the first account. The named
          \`eza-data\` volume keeps the control database, account libraries, snapshots and
          backups across container upgrades. For a remote host, set
          \`PUBLIC_ORIGIN=https://your-host\` and put a TLS proxy in front of port 8080;
          passkeys require a secure origin (or localhost).

          ## Updating

          Back up first, pull the new image, and recreate the container with the same
          volume:

          \`\`\`bash
          docker exec eza eza-bookmarks backup
          docker pull ghcr.io/meillaya/eza:${VERSION}
          docker rm -f eza
          docker run -d --name eza --restart unless-stopped \\
            -p 8080:8080 -v eza-data:/data \\
            ghcr.io/meillaya/eza:${VERSION}
          \`\`\`

          A version-pinned \`eza-${VERSION}-compose.yml\` is attached to this release for
          Compose users. Migrations run automatically on first start; see the upgrade
          notes below.

          ## Assets

          The container image is the installable artifact. The Nix flake builds the
          server and the content-addressed web client from source
          (\`packages.<system>.eza-bookmarks\` and \`packages.<system>.eza-web\`); no
          separate web bundle download is published for this release.

          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
            echo "::notice::updated the notes for existing release $TAG"
          else
            gh release create "$TAG" --title "eza $TAG" --notes "$notes"
            echo "::notice::created release $TAG"
          fi
