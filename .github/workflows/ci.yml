name: CI

on:
  push:
    branches: [main, haskell-rewrite]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Haskell tests
        run: devenv shell -- cabal test all
      # The full 4.5 MB export used by the opt-in EZA_IMPORT_FIXTURE test is
      # deliberately not committed (see .gitignore). CI relies on the tracked
      # fixtures under tests/fixtures/ instead.
      - name: Formal spec checks
        run: devenv shell -- bash scripts/check-specs.sh
      - name: Formatting and lint
        run: devenv shell -- bash -c 'fourmolu --mode check core server web && hlint core server web'
      # -Werror only rebuilds the local packages: dependencies come from the
      # cabal store built by the test step above, so third-party warnings do
      # not fail this gate.
      - name: GHC warnings gate (-Wall, tests included)
        run: devenv shell -- cabal build all --ghc-options=-Werror
      - name: Build Miso client
        run: devenv shell -- bash scripts/build-web.sh
      - name: Install browser-test dependencies
        run: devenv shell -- bun install --frozen-lockfile
      - name: Sidecar checks
        run: cd sidecar && npm ci && npm test
      - name: Extension checks
        run: cd extension && npm ci && npm test
      - name: Browser suite
        run: devenv shell -- bash scripts/e2e.sh
