name: CI

on:
  push:
    branches: [main, haskell-rewrite]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Haskell tests
        run: devenv shell -- cabal test all
      - name: Haskell tests (full import fixture)
        run: EZA_IMPORT_FIXTURE=$PWD/bookmarks_14_08_2026.html devenv shell -- cabal test all
      - name: Formal spec checks
        run: devenv shell -- bash scripts/check-specs.sh
      - name: Build server
        run: devenv shell -- cabal build all
      - name: Build Miso client
        run: devenv shell -- bash scripts/build-web.sh
      - name: Sidecar checks
        run: cd sidecar && npm ci && npm test
      - name: Extension checks
        run: cd extension && npm ci && npm test
      - name: Browser suite
        run: devenv shell -- bash scripts/e2e.sh
