apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eza-data
spec:
  # ReadWriteOncePod (Kubernetes 1.29+) allows exactly one *pod* to mount the
  # volume read-write, which matches what SQLite needs: the server is a
  # single-writer process and the Deployment below runs one replica. Plain
  # ReadWriteOnce is node-scoped, not pod-scoped: a second pod on the same
  # node (a manual `kubectl run`, a backup Job, an accidentally scaled
  # Deployment) can mount the same volume and open control.db/users/<id>.db.
  #
  # ReadWriteOncePod needs a storage class/provisioner that supports it. On a
  # cluster that only supports RWO, replace `- ReadWriteOncePod` with
  # `- ReadWriteOnce` and follow the fallback rules in docs/deployment-k8s.md:
  # only one *node* gets the volume, so never run a second writer pod on that
  # node; scale the Deployment to 0 before any backup/restore Job mounts it.
  accessModes:
    - ReadWriteOncePod
  # volumeMode: Filesystem        # default; the server needs a normal directory
  resources:
    requests:
      storage: 10Gi
  # storageClassName: local-path   # set for a specific provisioner
