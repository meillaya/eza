# Non-secret runtime configuration. Secrets live in eza-secrets (secret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: eza-config
data:
  EZA_DATA_DIR: /data
  # Account cap (EZA_MAX_USERS in Eza.Config; the server also sizes its
  # per-account slot pool from it).
  EZA_MAX_USERS: "32"
  EZA_BIND: 0.0.0.0:8080
  # Browser-visible origin — MUST be the URL users open (https in production).
  # Passkeys are bound to this origin; changing it after enrollment breaks them.
  PUBLIC_ORIGIN: https://eza.example.com
  # WebAuthn RP ID. This must be the PUBLIC_ORIGIN host (or its registrable
  # suffix): eza.example.com for https://eza.example.com. The server derives it
  # from PUBLIC_ORIGIN when unset, so the safe pattern is to delete this line
  # and only set PUBLIC_ORIGIN. It is kept here to make the pairing explicit.
  EZA_RP_ID: eza.example.com
  EZA_RP_NAME: eza
  EZA_LOG_LEVEL: info
  # Enrichment: in-process background workers (0 disables them), outbound
  # fetch limits, favicon cache, and the public-share lifetime.
  EZA_ENRICH_WORKERS: "2"
  EZA_FETCH_TIMEOUT_MS: "8000"
  EZA_FAVICON_MAX_BYTES: "65536"
  EZA_FAVICON_TTL_DAYS: "90"
  EZA_FAVICON_BACKFILL: "1"
  EZA_SHARE_TTL_DAYS: "7"
  EZA_MAX_BODY_BYTES: "8388608"
  EZA_IMPORT_MAX_BYTES: "33554432"
  EZA_SNAPSHOT_MAX_BYTES: "52428800"
  EZA_BACKUP_KEEP_DAYS: "14"
  # SSRF guard: private/RFC1918 fetches stay disabled unless opted in.
  EZA_ALLOW_PRIVATE_FETCH: "0"
  # AI tagging: "none" disables it; "ollama" needs no API key.
  EZA_AI_PROVIDER: "none"
  EZA_OLLAMA_BASE_URL: "http://127.0.0.1:11434"
  # Empty selects the provider default model.
  EZA_AI_MODEL: ""
