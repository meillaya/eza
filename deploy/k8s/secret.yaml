# Optional AI-tagging secrets. The server starts fine with empty values (the
# features stay disabled); SecretSpec's env provider treats the keys as unset.
#
# Do NOT commit real keys. Replace this file (or overlay it) with:
#
#   kubectl -n eza create secret generic eza-secrets \
#     --from-literal=ANTHROPIC_API_KEY="$(pass show anthropic/eza)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# and keep the manifest in your secret store (sops-nix / External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: eza-secrets
type: Opaque
stringData: {}
