# SQLite is a single-writer database: exactly one replica and Recreate
# rollouts, so a new pod never opens the database while the old one still has
# it open. Do not add replicas or switch to RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eza
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: eza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eza
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eza
          # Tag of `nix build .#docker`; push it to your registry and update here.
          image: eza:0.1.0.0
          imagePullPolicy: IfNotPresent
          # Resolve the optional AI keys through SecretSpec's env provider; keys
          # come from eza-secrets via envFrom below. The IMAGE's default Cmd is
          # the plain "eza-bookmarks serve" if you prefer to bypass SecretSpec.
          command:
            - /bin/secretspec
            - run
            - --file
            - /etc/eza/secretspec.toml
            - --provider
            - env
            - --profile
            - production
            - --
            - /bin/eza-bookmarks
            - serve
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eza-config
            - secretRef:
                name: eza-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # /healthz returns 200 {"status":"ok"} only when the SQLite database
          # answers; 503 otherwise. For exec probes, /bin/eza-bookmarks
          # healthcheck runs the same check and exits 0/1.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eza-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
