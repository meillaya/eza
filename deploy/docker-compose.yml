# eza — Docker Compose deployment (single host, SQLite on a named volume).
#
# The normal install pulls the published image:
#
#   cp deploy/docker-compose.yml ./docker-compose.eza.yml
#   docker compose -f docker-compose.eza.yml up -d
#
# Local developers can build the same image from the checkout with Nix (the web
# client is a CI-built WASM release asset, so there is no Dockerfile):
#
#   nix build .#docker
#   docker load < result
#   EZA_IMAGE=eza:0.4.0.0 docker compose -f deploy/docker-compose.yml up -d
#
# The container runs as uid/gid 10001 (non-root) and stores everything in the
# /data volume (eza.db, snapshots/, backups/).
#
# Full runbook: docs/deployment-docker.md
name: eza

services:
  eza:
    # Published multi-arch image; pin EZA_IMAGE to a version for reproducible
    # deployments. Local builders pass EZA_IMAGE=eza:<version>.
    image: ${EZA_IMAGE:-ghcr.io/meillaya/eza:latest}
    container_name: eza
    restart: unless-stopped
    ports:
      # Bind to loopback and put a TLS proxy (Caddy or nginx) in
      # front: passkeys require a secure origin.
      - "127.0.0.1:${EZA_PORT:-8080}:8080"
    environment:
      EZA_DATA_DIR: /data
      EZA_BIND: 0.0.0.0:8080
      # The browser-visible origin users open (https in production). Passkeys
      # are bound to it, and the server derives the WebAuthn RP ID from its
      # host, so setting PUBLIC_ORIGIN is enough for a normal deployment.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # EZA_RP_ID is deliberately NOT set by default: the server derives it
      # from PUBLIC_ORIGIN (host part, minus a leading "www."). Set it only
      # when the RP ID must differ from the origin host, e.g. an alias:
      #   EZA_RP_ID: ${EZA_RP_ID:-}
      # Hard-coding it here (it used to default to `localhost`) silently broke
      # passkey registration whenever only PUBLIC_ORIGIN was changed.
      # When set, it MUST be the PUBLIC_ORIGIN host or a registrable suffix of
      # it (https://eza.example.com -> eza.example.com); otherwise WebAuthn
      # rejects the ceremony. Changing either value invalidates enrolled
      # passkeys until recovery.
      # EZA_RP_NAME is only the passkey prompt label.
      EZA_RP_NAME: ${EZA_RP_NAME:-eza}
      EZA_LOG_LEVEL: ${EZA_LOG_LEVEL:-info}
      # Enrichment: in-process background workers (0 disables them), outbound
      # fetch limits, favicon cache, and the public-share lifetime.
      EZA_ENRICH_WORKERS: ${EZA_ENRICH_WORKERS:-2}
      EZA_FETCH_TIMEOUT_MS: ${EZA_FETCH_TIMEOUT_MS:-8000}
      EZA_FAVICON_MAX_BYTES: ${EZA_FAVICON_MAX_BYTES:-262144}
      EZA_FAVICON_TTL_DAYS: ${EZA_FAVICON_TTL_DAYS:-90}
      # One cached icon per source domain, fetched in the background; 0 disables.
      EZA_FAVICON_BACKFILL: ${EZA_FAVICON_BACKFILL:-1}
      EZA_SHARE_TTL_DAYS: ${EZA_SHARE_TTL_DAYS:-7}
      # Body-size and snapshot caps (bytes) plus backup retention.
      EZA_MAX_BODY_BYTES: ${EZA_MAX_BODY_BYTES:-8388608}
      EZA_IMPORT_MAX_BYTES: ${EZA_IMPORT_MAX_BYTES:-33554432}
      EZA_SNAPSHOT_MAX_BYTES: ${EZA_SNAPSHOT_MAX_BYTES:-52428800}
      EZA_BACKUP_KEEP_DAYS: ${EZA_BACKUP_KEEP_DAYS:-14}
      # SSRF guard: private/RFC1918 fetches stay disabled unless opted in.
      EZA_ALLOW_PRIVATE_FETCH: ${EZA_ALLOW_PRIVATE_FETCH:-0}
      # AI tagging: "none" disables it; "ollama" needs no API key.
      EZA_AI_PROVIDER: ${EZA_AI_PROVIDER:-none}
      EZA_OLLAMA_BASE_URL: ${EZA_OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      # Empty selects the provider default (Ollama llama3.2, OpenAI gpt-4o-mini, Anthropic claude-haiku-4-5).
      EZA_AI_MODEL: ${EZA_AI_MODEL:-}
      # Optional AI-tagging keys; empty disables the feature.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Optional: resolve secrets through SecretSpec's env provider instead of
    # plain environment variables. The image ships the manifest at
    # /etc/eza/secretspec.toml.
    # command:
    #   - /bin/secretspec
    #   - run
    #   - --file
    #   - /etc/eza/secretspec.toml
    #   - --provider
    #   - env
    #   - --profile
    #   - production
    #   - --
    #   - /bin/eza-bookmarks
    #   - serve
    healthcheck:
      # eza-bookmarks healthcheck: GET /healthz on EZA_BIND (200 = healthy).
      test: ["CMD", "/bin/eza-bookmarks", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - eza-data:/data

volumes:
  # The image pre-creates /data owned by 10001:10001, so a fresh named volume
  # is writable by the non-root container user without a manual chown.
  eza-data:
