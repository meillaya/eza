\* Bounded multi-user model: two accounts, two per-user databases, two
\* usernames, two nonces. The bounds live here so the model checker always
\* runs the same finite state space.
CONSTANT
    Users = {u1, u2}
    Dbs = {db1, db2}
    Usernames = {alice, bob}
    Nonces = {n1, n2}

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoCrossUserAccess
    SessionStableUser
    TokenStableUser
    DisabledUserNoSession
    SoleUserFallbackOnly
    AtLeastOneAdmin
    AccountKeysUnique
    DbPathsUnique
    RoleRegistered
    LoginAuthConsistent
