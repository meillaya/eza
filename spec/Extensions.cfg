\* Bounded extensions model: two accounts, two views, two webhooks, two events.
\* The bounds live here so the model checker always runs the same finite state
\* space.
CONSTANT
    Users = {u1, u2}
    ViewIds = {v1, v2}
    WebhookIds = {w1, w2}
    ViewKinds = {graph, ledger}
    EventKinds = {bookmark_created, clip_created}
    MaxViews = 2
    MaxWebhooks = 2
    MaxEvents = 2
    MaxRevisions = 1

SPECIFICATION Spec

INVARIANT
    TypeOK
    ViewOwnerOnly
    ViewIdUnique
    DefaultUniquePerKind
    WebhookOwnerOnly
    DisabledWebhookNoDelivery
    NoCodeExecution

\* CursorMonotone is an action property ([][A]_cursor), not a state predicate,
\* because monotonicity relates two consecutive states.
PROPERTY CursorMonotone
