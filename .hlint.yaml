# Project hlint policy.
#
# These are style-only hints that this codebase deliberately does not follow:
# the corresponding rewrites were reviewed during the audit and every remaining
# hint is a stylistic preference (eta reduction, lambda form, bracket shape,
# combinator choice), not a correctness or safety issue. Keeping them as
# errors would make `devenv shell -- lint` permanently red without finding
# anything, so they are ignored here. Real warnings (for example unused
# LANGUAGE pragmas, dodgy imports, or pattern-match problems) still fail.
- ignore: {name: "Redundant bracket"}
- ignore: {name: "Avoid lambda"}
- ignore: {name: "Eta reduce"}
- ignore: {name: "Use isNothing"}
- ignore: {name: "Use isJust"}
- ignore: {name: "Use const"}
- ignore: {name: "Use :"}
- ignore: {name: "Use fromMaybe"}
- ignore: {name: "Use fromRight"}
- ignore: {name: "Use void"}
- ignore: {name: "Use unless"}
- ignore: {name: "Use when"}
- ignore: {name: "Replace case with fromMaybe"}
- ignore: {name: "Replace case with maybe"}
- ignore: {name: "Avoid lambda using `infix`"}
- ignore: {name: "Redundant if"}
- ignore: {name: "Use catMaybes"}
- ignore: {name: "Use zipWith"}
- ignore: {name: "Redundant pure"}
- ignore: {name: "Functor law"}
- ignore: {name: "Use list comprehension"}
- ignore: {name: "Use <|>"}
- ignore: {name: "Use notElem"}
- ignore: {name: "Use newtype instead of data"}
- ignore: {name: "Use lambda-case"}
- ignore: {name: "Redundant take"}
- ignore: {name: "Use record patterns"}
- ignore: {name: "Use uncurry"}
- ignore: {name: "Use bimap"}
- ignore: {name: "Use list literal pattern"}
- ignore: {name: "Use isAsciiLower"}
- ignore: {name: "Redundant toList"}
- ignore: {name: "Move map inside list comprehension"}
- ignore: {name: "Use find"}
- ignore: {name: "Avoid reverse"}
- ignore: {name: "Use maybeToList"}
- ignore: {name: "Use tuple-section"}
- ignore: {name: "Use replicateM"}
- ignore: {name: "Use elem"}
