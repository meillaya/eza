# SecretSpec manifest: declares the secrets eza needs, never their values.
# Safe to commit. See docs/secrets.md for provider setup.
[project]
name = "eza"
revision = "1.0"

[profiles.default]
ANTHROPIC_API_KEY = { description = "Anthropic API key for optional AI tagging", required = false }
OPENAI_API_KEY = { description = "OpenAI or OpenAI-compatible API key for optional AI tagging", required = false }

[profiles.development]
# The developer's provider is selected by SecretSpec (keyring by default).
# Empty defaults keep the optional AI features disabled in a fresh shell.
ANTHROPIC_API_KEY = { description = "Anthropic API key for optional AI tagging", required = false, default = "" }
OPENAI_API_KEY = { description = "OpenAI or OpenAI-compatible API key for optional AI tagging", required = false, default = "" }

[profiles.production]
# Production reads secrets from systemd credentials (or env as a fallback).
ANTHROPIC_API_KEY = { description = "Anthropic API key for optional AI tagging", required = false, providers = ["systemd-credential", "env"] }
OPENAI_API_KEY = { description = "OpenAI or OpenAI-compatible API key for optional AI tagging", required = false, providers = ["systemd-credential", "env"] }
