# Bookmarks — Railway deployment configuration (plan todo 36).
#
# Builder: Railpack (Railway's default builder). This file deliberately does
# NOT use the repo Dockerfile — the Dockerfile is the verified image for
# local/NixOS-with-Docker and for `railway up` when a Dockerfile is preferred;
# Railpack is the zero-config path and the one the plan pins. If you prefer the
# hand-rolled image (non-root user, monolith binary, HEALTHCHECK), set
# builder = "DOCKERFILE" instead and delete the startCommand below — the
# Dockerfile already carries CMD + HEALTHCHECK that match this file.
#
# startCommand is wrapped in /bin/sh -c because Railway runs start commands in
# exec form, which does NOT expand environment variables. The shell wrapper is
# the documented way to make $PORT expand at runtime (Railway docs,
# build-and-start-commands). Without it, `--port $PORT` would be passed
# literally and uvicorn would fail to bind the injected port.
#
# healthcheckPath /health: the app exposes GET /health (auth-exempt, DB
# reachability probe, 200/503). Railway waits for a 200 before routing traffic.
#
# restartPolicyType ON_FAILURE: restart only when the deployment crashes, never
# on clean exit. Do NOT enable sleepApplication (serverless) — see README
# "Deploy — Railway" for cold-boot 502 and background-job impact.

"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"

[deploy]
startCommand = '/bin/sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"'
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
